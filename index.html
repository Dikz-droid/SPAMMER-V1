<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - ./Bio404Xploit</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');

:root {
  --bg-color: #0d1117;
  --panel-color: #161b22;
  --accent-color: #00ff9d;
  --accent-hover: #00d68f;
  --danger-color: #ff4d4d;
  --text-color: #c9d1d9;
  --input-bg: #21262d;
  --input-border: #30363d;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', sans-serif;
  background-color: var(--bg-color);
  color: var(--text-color);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  background-color: var(--panel-color);
  padding: 40px;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,255,157,0.1), 0 0 60px rgba(0,255,157,0.05);
  width: 100%;
  max-width: 400px;
  text-align: center;
  border: 1px solid var(--input-border);
}

h1 {
  margin-bottom: 25px;
  font-size: 24px;
  color: var(--accent-color);
  text-shadow: 0 0 5px var(--accent-color);
}

input {
  width: 100%;
  padding: 12px;
  margin-bottom: 15px;
  background-color: var(--input-bg);
  border: 1px solid var(--input-border);
  border-radius: 8px;
  color: var(--text-color);
  font-size: 14px;
  transition: border-color 0.3s, box-shadow 0.3s;
}

input:focus {
  outline: none;
  border-color: var(--accent-color);
  box-shadow: 0 0 5px var(--accent-color);
}

button {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 8px;
  background: var(--accent-color);
  color: #000;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.3s, box-shadow 0.3s;
  box-shadow: 0 0 10px rgba(0,255,157,0.3);
}

button:hover {
  background: var(--accent-hover);
  box-shadow: 0 0 15px rgba(0,255,157,0.6);
}

#status {
  margin-top: 15px;
  font-size: 13px;
  min-height: 18px;
  color: var(--accent-color);
  word-wrap: break-word;
}
</style>
</head>
<body>

<div class="container">
  <h1>Login - ./Bio404Xploit</h1>
  <input type="password" id="tokenInput" placeholder="Masukkan token">
  <button onclick="login()">Login</button>
  <div id="status"></div>
</div>

<script>
// Token valid yang diizinkan (bisa kamu ganti tokennya)
const VALID_TOKEN = "tkn-mshsgHhagsgHwhajGGfkwbshsjwbJwhaksbHsbKwboa";

// Fungsi login
function login() {
  const token = document.getElementById('tokenInput').value.trim();
  const status = document.getElementById('status');

  if (token === VALID_TOKEN) {
    status.style.color = "var(--accent-color)";
    status.textContent = "Login berhasil, mengalihkan...";

    // Simpan status login di sessionStorage
    sessionStorage.setItem('isLoggedIn', 'true');

    setTimeout(() => {
      window.location.href = "beranda.html";
    }, 1000);
  } else {
    status.style.color = "var(--danger-color)";
    status.textContent = "Token salah! Coba lagi.";
  }
}
</script>

</body>
</html>
